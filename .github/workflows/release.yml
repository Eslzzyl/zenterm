name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release ref
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and verify version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REF="$GITHUB_SHA"
            TAG=""
          else
            REF="$GITHUB_REF_NAME"
            TAG="$REF"
          fi

          git checkout --detach "$REF"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          print(next(p["version"] for p in data["packages"] if p["name"] == "zenterm"))
          ')"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$CARGO_VERSION"
          else
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
              echo "Tag version ($VERSION) does not match Cargo version ($CARGO_VERSION)" >&2
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  check:
    name: Lint & Test
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy, rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-unknown-linux-gnu

      - uses: ./.github/actions/install-linux-deps

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --package zenterm --all-targets -- -D warnings

      - name: Test
        run: cargo test --package zenterm

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [resolve, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            artifact_arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb
            expected_packages: 1
          - platform: linux
            arch: aarch64
            artifact_arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            formats: deb
            expected_packages: 1
          - platform: macos
            arch: x86_64
            artifact_arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            formats: dmg
            expected_packages: 1
          - platform: macos
            arch: aarch64
            artifact_arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            formats: dmg
            expected_packages: 1
          - platform: windows
            arch: x86_64
            artifact_arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
            expected_packages: 2
          - platform: windows
            arch: aarch64
            artifact_arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            # cargo-packager 0.11.8 bundles WiX 3.11.2, whose candle.exe
            # does not accept -arch arm64. NSIS is the supported ARM64 installer.
            formats: nsis
            expected_packages: 1
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - uses: ./.github/actions/install-linux-deps
        if: matrix.platform == 'linux'

      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build application and installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FORMATS: ${{ matrix.formats }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          cargo build --package zenterm --release --locked --target "$TARGET"
          packager_args=(
            --packages zenterm
            --release
            --target "$TARGET"
            --formats "$FORMATS"
            --out-dir dist
            --binaries-dir "target/$TARGET/release"
          )

          if [[ "$PLATFORM" == "macos" && "$ARCH" == "aarch64" ]]; then
            packager_log="$(mktemp)"
            trap 'rm -f "$packager_log"' EXIT
            for attempt in 1 2 3; do
              : > "$packager_log"
              if cargo packager "${packager_args[@]}" 2>&1 | tee "$packager_log"; then
                break
              fi
              if ! grep -Fq 'hdiutil: create failed - Resource busy' "$packager_log"; then
                echo "cargo packager failed with a non-retryable error" >&2
                exit 1
              fi
              if [[ "$attempt" -eq 3 ]]; then
                exit 1
              fi
              echo "hdiutil reported Resource busy; retrying cargo packager (attempt $((attempt + 1))/3)"
              rm -f dist/*.dmg
              sleep $((attempt * 5))
            done
          else
            cargo packager "${packager_args[@]}"
          fi

      - name: Normalize and validate package names
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.artifact_arch }}
          EXPECTED_PACKAGES: ${{ matrix.expected_packages }}
        run: |
          set -euo pipefail

          find_packages() {
            find dist -type f \( \
              -name '*.deb' -o \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.msi' \)
          }

          PACKAGE_COUNT="$(find_packages | wc -l | tr -d ' ')"

          if [[ "$PACKAGE_COUNT" -ne "$EXPECTED_PACKAGES" ]]; then
            echo "Expected $EXPECTED_PACKAGES packages, found $PACKAGE_COUNT" >&2
            find dist -type f -print
            exit 1
          fi

          find_packages | while IFS= read -r file; do
            case "$file" in
              *.deb)      package_name="zenterm-v${VERSION}-${PLATFORM}-${ARCH}.deb" ;;
              *.dmg)      package_name="zenterm-v${VERSION}-${PLATFORM}-${ARCH}.dmg" ;;
              *.exe)      package_name="zenterm-v${VERSION}-${PLATFORM}-${ARCH}-setup.exe" ;;
              *.msi)      package_name="zenterm-v${VERSION}-${PLATFORM}-${ARCH}.msi" ;;
              *)           continue ;;
            esac
            mv "$file" "dist/$package_name"
          done

          find dist -maxdepth 1 -type f -print

      - name: Upload Linux package
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          path: dist/zenterm-v${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.artifact_arch }}.deb
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload macOS package
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          path: dist/zenterm-v${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.artifact_arch }}.dmg
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Windows setup package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/zenterm-v${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.artifact_arch }}-setup.exe
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Windows MSI package
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          path: dist/zenterm-v${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.artifact_arch }}.msi
          if-no-files-found: error
          retention-days: 30
          archive: false

  release:
    name: Publish GitHub Release
    needs: [resolve, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zenterm-v${{ needs.resolve.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release-assets/* > release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              release-assets/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zenterm v${VERSION}" \
              --generate-notes \
              release-assets/*
          fi
