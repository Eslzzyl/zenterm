name: Install Linux dependencies

description: Install the native Linux libraries required to compile zenterm (GTK3 / X11 / Wayland / XCB / font / audio / system).

runs:
  using: 'composite'
  steps:
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libdbus-1-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libgtk-3-dev \
          libudev-dev \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcb-render-util0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          pkg-config \
          patchelf \
          rpm
