[package]
name = "zenterm"
version.workspace = true
edition = "2024"

[package.metadata.packager]
product-name = "Zenterm"
identifier = "org.eu.eslzzyl.zenterm"
icons = [
    "../../assets/macos/zenterm.icns",
    "../../assets/windows/zenterm.ico",
    "../../assets/runtime/zenterm.png",
]
resources = [
    { src = "../../assets/windows/zenterm.ico", target = "zenterm.ico" },
]

[package.metadata.packager.nsis]
template = "../../packaging/windows/installer.nsi"
installer-icon = "../../assets/windows/zenterm.ico"
installMode = "both"

[package.metadata.packager.wix]
template = "../../packaging/windows/main.wxs"

[dependencies]
zenterm-config = { path = "../zenterm-config" }
zenterm-ui = { path = "../zenterm-ui" }
eframe = "0.34"
egui = "0.34"
env_logger = "0.11"
log = "0.4"
notify-rust = "4"
wgpu = "29"
